<!-- paste this INLINE into your HTML body for hover to work -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="50" height="50" viewBox="0 0 50 50" aria-label="LB badge" role="img">
  <style>
    /* Background */
    .bg { fill: #3f3f3f; rx: 8px; ry: 8px; }
    .outline { fill: none; stroke: rgba(0,0,0,0.13); stroke-width: 0.5; rx: 7.5px; ry: 7.5px; }

    /* Text: ui-monospace preference */
    .brace, .initials {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, "Roboto Mono", monospace;
      fill: #fff;
      font-weight: 400;
      text-anchor: middle;
      dominant-baseline: middle;   /* baseline centering */
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 220ms cubic-bezier(.2,.9,.2,1);
    }

    /* Sizes: adjust these two to change visual dominance */
    .brace    { font-size: 26px; }  /* taller frame */
    .initials { font-size: 20px; }  /* LB height ≈ brace inner height */

    /* caret (hidden until hover) */
    .caret { opacity: 0; transform-box: fill-box; transform-origin: center; transition: opacity 160ms; }

    /* Hover (works when SVG is inline) */
    svg:hover .brace-left  { transform: translateX(-1.8px) rotate(-9deg); }
    svg:hover .brace-right { transform: translateX(1.8px)  rotate(9deg); }
    /* small vertical nudge on hover to keep visual center during scale */
    svg:hover .initials    { transform: translateY(-0.2px) scale(1.05); }
    svg:hover .caret       { opacity: 1; animation: blink 1s steps(2,start) infinite; transform: translateX(1.6px); }

    @keyframes blink {
      0%   { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; }
    }

    /* subtle hover glow */
    svg:hover .bg { filter: drop-shadow(0 1px 6px rgba(0,0,0,0.36)); }
  </style>

  <!-- rounded background -->
  <rect class="bg" x="1" y="1" width="48" height="48" rx="8" ry="8"/>
  <rect class="outline" x="1.5" y="1.5" width="47" height="47"/>

  <!-- LEFT BRACE: numeric x keeps it stable across renderers.
       dy is a tiny vertical tweak for visual centering across fonts. -->
  <text class="brace brace-left" x="10"  y="26" dy="0.9">{</text>

  <!-- INITIALS: centered. dy nudges vertical placement to correct font-metric drift -->
  <text class="initials" x="25" y="27" dy="-0.6">LB</text>

  <!-- RIGHT BRACE -->
  <text class="brace brace-right" x="40" y="26" dy="0.9">}</text>

  <!-- Caret: visually matches initials height -->
  <rect class="caret" x="30.3" y="8.5" width="1.4" height="33" rx="0.3" ry="0.3" fill="#fff"/>
</svg>
